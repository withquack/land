<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Shield outline -->
  <path d="M100 10 L180 40 L180 100 Q180 160 100 230 Q20 160 20 100 L20 40 Z"
        fill="url(#shieldGradient)"
        stroke="#FF9C20"
        stroke-width="4"/>

  <!-- Inner shield detail -->
  <path d="M100 30 L160 52 L160 100 Q160 145 100 200 Q40 145 40 100 L40 52 Z"
        fill="rgba(255, 156, 32, 0.1)"
        stroke="#FF8D00"
        stroke-width="2"/>

  <!-- Angel wing - left -->
  <path d="M70 90 Q50 100 50 120 Q50 130 60 135 Q70 130 75 120 L70 90 Z"
        fill="#FFD700"
        opacity="0.8"/>

  <!-- Angel wing - right -->
  <path d="M130 90 Q150 100 150 120 Q150 130 140 135 Q130 130 125 120 L130 90 Z"
        fill="#FFD700"
        opacity="0.8"/>

  <!-- Center checkmark/protection symbol -->
  <path d="M85 110 L95 125 L120 95"
        stroke="#FF9C20"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
