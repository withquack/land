<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Minecraft-style blocky landscape -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9FD8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- Grass Blocks -->
  <!-- Row 1 -->
  <rect x="0" y="280" width="80" height="80" fill="#7CB342"/>
  <rect x="0" y="280" width="80" height="10" fill="#9CCC65"/>
  <rect x="80" y="280" width="80" height="80" fill="#689F38"/>
  <rect x="80" y="280" width="80" height="10" fill="#8BC34A"/>
  <rect x="160" y="260" width="80" height="100" fill="#7CB342"/>
  <rect x="160" y="260" width="80" height="10" fill="#9CCC65"/>
  <rect x="240" y="280" width="80" height="80" fill="#689F38"/>
  <rect x="240" y="280" width="80" height="10" fill="#8BC34A"/>
  <rect x="320" y="300" width="80" height="60" fill="#7CB342"/>
  <rect x="320" y="300" width="80" height="10" fill="#9CCC65"/>

  <!-- Row 2 -->
  <rect x="0" y="360" width="80" height="40" fill="#8D6E63"/>
  <rect x="80" y="360" width="80" height="40" fill="#A1887F"/>
  <rect x="160" y="360" width="80" height="40" fill="#8D6E63"/>
  <rect x="240" y="360" width="80" height="40" fill="#A1887F"/>
  <rect x="320" y="360" width="80" height="40" fill="#8D6E63"/>

  <!-- Diamond Ore Block (highlight) -->
  <g transform="translate(160, 180)">
    <rect x="0" y="0" width="80" height="80" fill="#7E7E7E"/>
    <!-- Diamond sparkles with subtle pulse -->
    <rect x="20" y="15" width="12" height="12" fill="#00FFFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="45" y="25" width="15" height="15" fill="#00E5FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="50" width="10" height="10" fill="#00D4FF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="55" y="55" width="13" height="13" fill="#00FFFF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Creeper Face (iconic) -->
  <g transform="translate(240, 100)">
    <!-- Green block base -->
    <rect x="0" y="0" width="80" height="100" fill="#0DA70D" rx="4"/>
    <rect x="0" y="0" width="80" height="15" fill="#0F0" opacity="0.2"/>

    <!-- Eyes -->
    <rect x="15" y="25" width="15" height="20" fill="#000000"/>
    <rect x="50" y="25" width="15" height="20" fill="#000000"/>

    <!-- Nose -->
    <rect x="35" y="50" width="10" height="15" fill="#000000"/>

    <!-- Mouth -->
    <rect x="25" y="70" width="10" height="15" fill="#000000"/>
    <rect x="35" y="80" width="10" height="10" fill="#000000"/>
    <rect x="45" y="70" width="10" height="15" fill="#000000"/>
  </g>

  <!-- Torch (light source) with flicker -->
  <g transform="translate(80, 220)">
    <rect x="6" y="15" width="8" height="35" fill="#5D4037"/>
    <polygon points="10,0 15,8 18,15 2,15 5,8" fill="#FFB300">
      <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="10,0 13,6 15,12 5,12 7,6" fill="#FFC107" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.6;0.8;0.7;0.8" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Pickaxe -->
  <g transform="translate(20, 80) rotate(-45)">
    <rect x="0" y="0" width="60" height="8" fill="#00FFFF"/>
    <rect x="55" y="-10" width="8" height="60" fill="#8D6E63"/>
  </g>

  <!-- Simple clouds with animation -->
  <g class="clouds">
    <rect x="50" y="40" width="30" height="15" fill="#FFFFFF" opacity="0.7">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="20 0"
        dur="20s"
        repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="30" width="20" height="15" fill="#FFFFFF" opacity="0.7">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="20 0"
        dur="20s"
        repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="60" width="40" height="15" fill="#FFFFFF" opacity="0.6">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-30 0"
        dur="25s"
        repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="50" width="25" height="15" fill="#FFFFFF" opacity="0.6">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-30 0"
        dur="25s"
        repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
